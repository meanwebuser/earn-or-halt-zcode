<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Earn or Halt zcode layers</title>
  <desc id="desc">The zcode prototype separates receipts, ranking, heartbeat and resurrection layers around a mock runtime.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#201438"/>
      <stop offset="1" stop-color="#3b275e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10091d" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="28" fill="url(#bg)"/>
  <circle cx="1050" cy="90" r="180" fill="#f0abfc" opacity=".12"/>
  <circle cx="120" cy="570" r="200" fill="#67e8f9" opacity=".10"/>
  <text x="72" y="92" fill="#fdf4ff" font-family="Inter,Arial,sans-serif" font-size="46" font-weight="700">Earn or Halt · zcode</text>
  <text x="74" y="132" fill="#e9d5ff" font-family="Inter,Arial,sans-serif" font-size="22">Receipts, rank, heartbeat and resurrection — as a Python MVP.</text>
  <g filter="url(#shadow)">
    <rect x="70" y="205" width="240" height="190" rx="20" fill="#2a1c46" stroke="#67e8f9" stroke-width="2"/>
    <text x="100" y="252" fill="#67e8f9" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">RECEIPTS</text>
    <text x="100" y="298" fill="#fdf4ff" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="600">SQLite ledger</text>
    <text x="100" y="335" fill="#e9d5ff" font-family="Inter,Arial,sans-serif" font-size="18">expiry + duplicate</text>
    <text x="100" y="365" fill="#e9d5ff" font-family="Inter,Arial,sans-serif" font-size="18">mock signatures</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="340" y="205" width="240" height="190" rx="20" fill="#2a1c46" stroke="#c4b5fd" stroke-width="2"/>
    <text x="370" y="252" fill="#c4b5fd" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">RANK</text>
    <text x="370" y="298" fill="#fdf4ff" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="600">profit window</text>
    <text x="370" y="335" fill="#e9d5ff" font-family="Inter,Arial,sans-serif" font-size="18">top-three routing</text>
    <text x="370" y="365" fill="#e9d5ff" font-family="Inter,Arial,sans-serif" font-size="18">alive is separate</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="610" y="205" width="240" height="190" rx="20" fill="#2a1c46" stroke="#f0abfc" stroke-width="2"/>
    <text x="640" y="252" fill="#f0abfc" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">HEARTBEAT</text>
    <text x="640" y="298" fill="#fdf4ff" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="600">local peers</text>
    <text x="640" y="335" fill="#e9d5ff" font-family="Inter,Arial,sans-serif" font-size="18">live / suspect</text>
    <text x="640" y="365" fill="#e9d5ff" font-family="Inter,Arial,sans-serif" font-size="18">in-memory reader</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="880" y="205" width="250" height="190" rx="20" fill="#2a1c46" stroke="#fbbf24" stroke-width="2"/>
    <text x="910" y="252" fill="#fcd34d" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">RESURRECTION</text>
    <text x="910" y="298" fill="#fdf4ff" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="600">fetch + hash</text>
    <text x="910" y="335" fill="#e9d5ff" font-family="Inter,Arial,sans-serif" font-size="18">safe extraction</text>
    <text x="910" y="365" fill="#e9d5ff" font-family="Inter,Arial,sans-serif" font-size="18">mock signature gate</text>
  </g>
  <text x="72" y="500" fill="#fdf4ff" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="600">Prototype boundary: integrated runtime is mock-only</text>
  <text x="72" y="540" fill="#e9d5ff" font-family="Inter,Arial,sans-serif" font-size="18">No live peer network, cryptographic receipt verification or production deployment claim.</text>
</svg>
